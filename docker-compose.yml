version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: AgricultureDB
      MYSQL_USER: agri_user
      MYSQL_PASSWORD: agri_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/seed_catalog.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: AgricultureDB
      DB_USER: agri_user
      DB_PASSWORD: agri_password
      APP_SECRET_KEY: super_secret_app_key_min_32_characters_long_12345
      PORT: 8000
    depends_on:
      - db

volumes:
  db_data:
